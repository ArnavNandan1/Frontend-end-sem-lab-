<!DOCTYPE html>
<html>
<head>
<title>Student Login</title>
<style>
body {
  background: #eaf2ff;
  font-family: Arial;
  text-align: center;
  padding-top: 70px;
}
form {
  background: white;
  width: 300px;
  margin: auto;
  padding: 25px;
  border-radius: 12px;
}
input {
  padding: 10px;
  margin: 8px;
  width: 85%;
}
button {
  background: blue;
  color: white;
  padding: 10px 20px;
  border: none;
  cursor: pointer;
  border-radius: 5px;
}
#msg { font-weight: bold; }
</style>
</head>

<body>

<form id="login">
<h2>Student Login</h2>

<input id="name" placeholder="Name" required><br>
<input id="email" type="email" placeholder="Email" required><br>
<input id="pass" type="password" placeholder="Password" required><br>

<button type="submit">Login</button>
<p id="msg"></p>
</form>

<script>

// Save user data
localStorage.setItem("name", "Arnav");
localStorage.setItem("email", "test@gmail.com");
localStorage.setItem("password", "12345");

// Check login
document.getElementById("login").onsubmit = function(e) {
  e.preventDefault();

  let email = document.getElementById("email").value;
  let pass = document.getElementById("pass").value;

  if(email === localStorage.getItem("email") &&
     pass === localStorage.getItem("password")) {
    document.getElementById("msg").innerText = "Login successful!";
    document.getElementById("msg").style.color = "green";
  } else {
    document.getElementById("msg").innerText = "Invalid email or password!";
    document.getElementById("msg").style.color = "red";
  }
};

</script>
</body>
</html>
